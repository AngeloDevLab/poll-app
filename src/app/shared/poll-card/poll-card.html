<article
  class="poll-card"
  [class.poll-card--ending-soon]="variant() === 'ending-soon'"
  [class.poll-card--closed]="isClosed()"
>
  <span class="poll-card__category">{{ displayCategory() }}</span>
  <h3 class="poll-card__title">
    <!-- The link's ::after stretches over the whole card, making all of it clickable. -->
    <a class="poll-card__link" [routerLink]="['/polls', poll().id]">{{ poll().title }}</a>
  </h3>
  @if (poll().deadline; as deadline) {
    <p class="poll-card__deadline">{{ deadline | endsIn }}</p>
  } @else {
    <p class="poll-card__deadline">No deadline</p>
  }
</article>
