<dialog #dialogRef class="survey-published-dialog" (close)="onDialogClosed()">
  <div class="survey-published-dialog__content">
    <p class="survey-published-dialog__text">Your survey is now published!</p>
    <button type="button" class="survey-published-dialog__close" (click)="close()" aria-label="Close">
      <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="#221227" stroke-width="2" stroke-linecap="round">
        <line x1="6" y1="6" x2="18" y2="18" />
        <line x1="18" y1="6" x2="6" y2="18" />
      </svg>
    </button>
  </div>
</dialog>
