<dialog #dialogRef class="new-survey-dialog" (close)="onDialogClosed()" (click)="onDialogClick($event)">
  <div class="inner-dialog">

    <img src="/images/logo-purple-dark.png" alt="logo">

    <form class="new-survey-form" (submit)="onSubmit($event)">
      <header class="new-survey-form__header">

        <div class="new-survey-form__header-top-bar">
          <div class="new-survey-form__status">Draft</div>
          <button type="button" class="btn btn--secondary" (click)="close()" aria-label="Close">
            <svg viewBox="0 0 24 24" width="20" height="20" fill="#FEFDFF" stroke="#FEFDFF" stroke-width="2"
              stroke-linecap="round">
              <line x1="6" y1="6" x2="18" y2="18" />
              <line x1="18" y1="6" x2="6" y2="18" />
            </svg>
          </button>
        </div>
        <h2 class="new-survey-form__title">Create new survey</h2>
      </header>

      <section class="new-survey-form__section">
        <app-labeled-input label="Survey name" [(value)]="title" [error]="titleError() ? 'Required' : null"
          (blurred)="markTouched('title')" />

        <div class="field">
          <div class="field__control">
            <app-dropdown label="Choose category" [options]="categoryOptions" [value]="category()"
              (valueChange)="category.set($event)" (closed)="markTouched('category')" />
            @if (categoryError()) {
            <span class="field__error">Please choose a category.</span>
            } @else {
            <span class="field__value">{{ category() }}</span>
            }
          </div>
        </div>

        <app-labeled-input label="Set end date" [optional]="true" type="date" [(value)]="deadline" />
        <app-labeled-input label="Describing text" [optional]="true" [multiline]="true" [(value)]="description" />

        @for (question of questions(); track $index; let qi = $index) {
        <div class="question-block">
          <div class="question-block__header">
            <app-labeled-input class="question-block__title" [label]="(qi + 1) + '. Question'" [value]="question.text"
              [error]="questionError(question, qi) ? 'Required' : null"
              (valueChange)="updateQuestionText(qi, $event)" (removeRequested)="removeQuestion(qi)"
              (blurred)="markTouched('question-' + qi)" />
          </div>

          <div class="question-block__answers-header">
            <span class="field__label">Answers</span>
            <label class="checkbox">
              <input type="checkbox" [checked]="question.allowMultiple" (change)="onAllowMultipleChange(qi, $event)" />
              Allow multiple answers.
            </label>
          </div>

          @for (option of question.options; track $index; let oi = $index) {
          <app-labeled-input [label]="optionLabel(oi)" [value]="option"
            [error]="optionError(question, qi, oi) ? 'Required' : null"
            (valueChange)="updateOption(qi, oi, $event)" (removeRequested)="removeOption(qi, oi)"
            (blurred)="markTouched('option-' + qi + '-' + oi)" />
          }
          <button type="button" class="btn btn--tertiary" (click)="addOption(qi)">
            <span class="btn--tertiary__inner">
              <span>Add answer</span>
              <svg viewBox="0 0 20 20" width="20" height="20" fill="#FEFDFF" xmlns="http://www.w3.org/2000/svg">
                <path
                  d="M9 11V14C9 14.2833 9.09583 14.5208 9.2875 14.7125C9.47917 14.9042 9.71667 15 10 15C10.2833 15 10.5208 14.9042 10.7125 14.7125C10.9042 14.5208 11 14.2833 11 14V11H14C14.2833 11 14.5208 10.9042 14.7125 10.7125C14.9042 10.5208 15 10.2833 15 10C15 9.71667 14.9042 9.47917 14.7125 9.2875C14.5208 9.09583 14.2833 9 14 9H11V6C11 5.71667 10.9042 5.47917 10.7125 5.2875C10.5208 5.09583 10.2833 5 10 5C9.71667 5 9.47917 5.09583 9.2875 5.2875C9.09583 5.47917 9 5.71667 9 6V9H6C5.71667 9 5.47917 9.09583 5.2875 9.2875C5.09583 9.47917 5 9.71667 5 10C5 10.2833 5.09583 10.5208 5.2875 10.7125C5.47917 10.9042 5.71667 11 6 11H9ZM10 20C8.61667 20 7.31667 19.7375 6.1 19.2125C4.88333 18.6875 3.825 17.975 2.925 17.075C2.025 16.175 1.3125 15.1167 0.7875 13.9C0.2625 12.6833 0 11.3833 0 10C0 8.61667 0.2625 7.31667 0.7875 6.1C1.3125 4.88333 2.025 3.825 2.925 2.925C3.825 2.025 4.88333 1.3125 6.1 0.7875C7.31667 0.2625 8.61667 0 10 0C11.3833 0 12.6833 0.2625 13.9 0.7875C15.1167 1.3125 16.175 2.025 17.075 2.925C17.975 3.825 18.6875 4.88333 19.2125 6.1C19.7375 7.31667 20 8.61667 20 10C20 11.3833 19.7375 12.6833 19.2125 13.9C18.6875 15.1167 17.975 16.175 17.075 17.075C16.175 17.975 15.1167 18.6875 13.9 19.2125C12.6833 19.7375 11.3833 20 10 20ZM10 18C12.2333 18 14.125 17.225 15.675 15.675C17.225 14.125 18 12.2333 18 10C18 7.76667 17.225 5.875 15.675 4.325C14.125 2.775 12.2333 2 10 2C7.76667 2 5.875 2.775 4.325 4.325C2.775 5.875 2 7.76667 2 10C2 12.2333 2.775 14.125 4.325 15.675C5.875 17.225 7.76667 18 10 18Z" />
              </svg>
            </span>
          </button>
        </div>
        }

        <div class="new-survey-form__add-question">
          <button type="button" class="btn btn--secondary" (click)="addQuestion()">
            <span>Add next question</span>
            <svg viewBox="0 0 20 20" width="20" height="20" fill="#FEFDFF" xmlns="http://www.w3.org/2000/svg">
              <path
                d="M9 11V14C9 14.2833 9.09583 14.5208 9.2875 14.7125C9.47917 14.9042 9.71667 15 10 15C10.2833 15 10.5208 14.9042 10.7125 14.7125C10.9042 14.5208 11 14.2833 11 14V11H14C14.2833 11 14.5208 10.9042 14.7125 10.7125C14.9042 10.5208 15 10.2833 15 10C15 9.71667 14.9042 9.47917 14.7125 9.2875C14.5208 9.09583 14.2833 9 14 9H11V6C11 5.71667 10.9042 5.47917 10.7125 5.2875C10.5208 5.09583 10.2833 5 10 5C9.71667 5 9.47917 5.09583 9.2875 5.2875C9.09583 5.47917 9 5.71667 9 6V9H6C5.71667 9 5.47917 9.09583 5.2875 9.2875C5.09583 9.47917 5 9.71667 5 10C5 10.2833 5.09583 10.5208 5.2875 10.7125C5.47917 10.9042 5.71667 11 6 11H9ZM10 20C8.61667 20 7.31667 19.7375 6.1 19.2125C4.88333 18.6875 3.825 17.975 2.925 17.075C2.025 16.175 1.3125 15.1167 0.7875 13.9C0.2625 12.6833 0 11.3833 0 10C0 8.61667 0.2625 7.31667 0.7875 6.1C1.3125 4.88333 2.025 3.825 2.925 2.925C3.825 2.025 4.88333 1.3125 6.1 0.7875C7.31667 0.2625 8.61667 0 10 0C11.3833 0 12.6833 0.2625 13.9 0.7875C15.1167 1.3125 16.175 2.025 17.075 2.925C17.975 3.825 18.6875 4.88333 19.2125 6.1C19.7375 7.31667 20 8.61667 20 10C20 11.3833 19.7375 12.6833 19.2125 13.9C18.6875 15.1167 17.975 16.175 17.075 17.075C16.175 17.975 15.1167 18.6875 13.9 19.2125C12.6833 19.7375 11.3833 20 10 20ZM10 18C12.2333 18 14.125 17.225 15.675 15.675C17.225 14.125 18 12.2333 18 10C18 7.76667 17.225 5.875 15.675 4.325C14.125 2.775 12.2333 2 10 2C7.76667 2 5.875 2.775 4.325 4.325C2.775 5.875 2 7.76667 2 10C2 12.2333 2.775 14.125 4.325 15.675C5.875 17.225 7.76667 18 10 18Z" />
            </svg>
          </button>
        </div>
      </section>

      <footer class="new-survey-form__footer">
        <button type="submit" class="btn btn--primary">
          <span>Publish</span>
          <span class="btn__icon">
            <img src="/icons/check.svg" alt="">
          </span>
        </button>
      </footer>
    </form>

  </div>


</dialog>
